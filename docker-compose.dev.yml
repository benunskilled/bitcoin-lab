# Local development / verification stack - NOT the Umbrel app package.
# Spins up a regtest bitcoind (so blocks can be generated on demand to
# exercise the relay-profiler's ZMQ path end-to-end) plus all four
# Bitcoin Lab services, built from the local Dockerfile.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#   ./test/regtest-generate.sh          # mine a block, watch relay-profiler log it
#
# Dashboard: http://localhost:8788

services:
  bitcoind:
    # A throwaway regtest node for exercising the ZMQ path - not a mirror of
    # what you run in production, and deliberately not the Umbrel bitcoin app
    # (that image bundles a whole UI). Bitcoin Core publishes no official image,
    # so this is the third-party bitcoin/bitcoin build, which checks the release
    # signatures with Core's verify.py. Pinned by digest, not floating.
    #
    # Keep it on the Core version in CORE_VERSION (.github/workflows/ci.yml). To
    # try another version:
    #
    #   BITCOIND_IMAGE=bitcoin/bitcoin:31.0 docker compose -f docker-compose.dev.yml up
    image: ${BITCOIND_IMAGE:-bitcoin/bitcoin:32.1@sha256:d2454aaf2ff4ce1ebbc49f4aa05ed044c907b849a80a3f4c0ad23e488e50bbe0}
    command:
      - -regtest=1
      - -server=1
      - -rpcuser=bitcoinlab
      - -rpcpassword=bitcoinlab
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -zmqpubhashblock=tcp://0.0.0.0:28334
      - -fallbackfee=0.0002
      - -txindex=1
    volumes:
      - ./dev-data/bitcoind:/home/bitcoin/.bitcoin
    ports:
      # Loopback only. This node accepts -rpcallowip=0.0.0.0/0 with fixed,
      # published credentials, so binding it to every interface put an open
      # RPC on the whole local network for as long as the dev stack ran.
      - "127.0.0.1:18443:18443" # regtest RPC, for manual bitcoin-cli use while developing

  dashboard:
    build: .
    command: ["node", "src/dashboard-server.js"]
    depends_on: [bitcoind]
    environment: &bitcoin-env
      BITCOIN_RPC_HOST: bitcoind
      BITCOIN_RPC_PORT: "18443"
      BITCOIN_RPC_USER: bitcoinlab
      BITCOIN_RPC_PASS: bitcoinlab
      BITCOIN_ZMQ_HOST: bitcoind
      BITCOIN_ZMQ_HASHBLOCK_PORT: "28334"
      BITCOIN_NETWORK: regtest
      DATA_DIR: /data
      LOG_LEVEL: debug
    volumes:
      - ./dev-data/app:/data
    ports:
      - "8788:8788"

  peer-profiler:
    build: .
    command: ["node", "src/peer-profiler.js"]
    depends_on: [bitcoind]
    environment: *bitcoin-env
    volumes:
      - ./dev-data/app:/data

  relay-profiler:
    build: .
    command: ["node", "src/relay-profiler.js"]
    depends_on: [bitcoind]
    environment: *bitcoin-env
    volumes:
      - ./dev-data/app:/data

  stratum-race:
    build: .
    command: ["node", "src/stratum-race.js"]
    depends_on: [bitcoind]
    environment: *bitcoin-env
    volumes:
      - ./dev-data/app:/data
