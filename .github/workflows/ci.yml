name: Tests

# Runs on every push and pull request, not only on release tags - so a broken
# change is visible before it is tagged, rather than after it has already been
# built and published.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
