name: Tests

# Runs on every push and pull request, not only on release tags - so a broken
# change is visible before it is tagged, rather than after it has already been
# built and published.
#
# Tags are no longer listed under `push:`. They are covered by `workflow_call:`
# instead: release.yml calls this workflow as its first job and gates the
# publish on it, so on a tag these checks run exactly once and a red one stops
# the image from being pushed rather than being a second, independent workflow
# that goes red beside a green release.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call: {}
  workflow_dispatch: {}

# Least privilege, set at the workflow level so no job can inherit anything
# wider: nothing here writes to the repository, publishes a package or touches
# an issue. A checkout needs `contents: read` and that is the whole list. This
# block previously did not exist, which meant these jobs ran with whatever the
# repository default happened to be - a write token, in a default-permissive
# repository, handed to `npm ci` running third-party install scripts.
permissions:
  contents: read

# One run per ref. Two pushes in quick succession to the same branch no longer
# race: the older run is cancelled, which only ever discards an answer nobody
# is waiting for any more.
#
# A tag is never cancelled. On a tag this workflow is running as release.yml's
# gate, and cancelling it would cancel the checks a publish is waiting on -
# which reads as "cancelled", not "failed", and is exactly how a half-checked
# release gets published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# Every `uses:` below is pinned to a full commit SHA with the released version
# in the comment beside it. A tag - even `v4` - is a pointer the action's owner
# can move, so `@v4` means "whatever that account publishes next", evaluated on
# every run. The SHA is the artifact itself. Upgrading is now a deliberate
# edit: read the release notes, change the SHA, change the comment.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Keep going when one version fails: which versions pass and which do not
      # is the whole point of testing more than one.
      fail-fast: false
      matrix:
        # package.json allows >=22, so testing 22 alone tested the floor and
        # nothing else. Both runtime dependencies are native modules
        # (better-sqlite3, zeromq), which are the most likely thing to break on
        # a new major - and that break would otherwise surface on a user's
        # node, on an architecture nobody here builds on, weeks later.
        node-version: ['22', '24']
    name: Node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Peer Map's kinds.go, for the test that both apps judge every peer the
      # same way. Without it that test skips, and a green run proved nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: benunskilled/peer-map
          path: peer-map
          # That one file: anything more inside the workspace is a file
          # `node --test` might take for one of ours.
          sparse-checkout: kinds.go
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          PEER_MAP_DIR: ${{ github.workspace }}/peer-map

  # Everything in the job above proves this code does what it was written to
  # do. None of it can prove the thing the app rests on: that Bitcoin Core
  # reports what the app assumes it reports. getpeerinfo's last_block,
  # connection_type and addr; addnode and getaddednodeinfo; a pubhashblock
  # message carrying a display-order hash. Those are somebody else's promises,
  # they can change between major versions, and a mock agrees with whatever it
  # was taught.
  #
  # So this one runs two real regtest nodes and checks the claim the whole
  # product is built on: that the peer which delivered a block is the peer the
  # app credits with it.
  #
  # On every push and pull request. Core is cached, so this is
  # about a minute, and a change that breaks the claim above shows up in its
  # PR rather than first at the release.
  integration:
    runs-on: ubuntu-latest
    name: Against real Bitcoin Core
    env:
      # Bumping this is the entire maintenance burden of this job, and the
      # reason to bump it is a new Core release, not a schedule.
      CORE_VERSION: '32.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # 90 MB, and the same 90 MB every time until CORE_VERSION changes.
      - name: Cache Bitcoin Core
        id: core-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/bitcoin-core
          key: bitcoin-core-${{ env.CORE_VERSION }}-x86_64-linux-gnu

      - name: Fetch and verify Bitcoin Core
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://bitcoincore.org/bin/bitcoin-core-${CORE_VERSION}"
          TARBALL="bitcoin-${CORE_VERSION}-x86_64-linux-gnu.tar.gz"
          mkdir -p ~/bitcoin-core && cd ~/bitcoin-core

          if ! curl -fsSLO "${BASE}/${TARBALL}"; then
            echo "::error::Could not fetch ${BASE}/${TARBALL}"
            echo "Check https://bitcoincore.org/bin/ for the current version and update CORE_VERSION above."
            exit 1
          fi
          curl -fsSLO "${BASE}/SHA256SUMS"

          # This checks that what arrived is what the release lists - a guard
          # against a truncated or corrupted download, which is the failure that
          # actually happens. It is NOT a guard against bitcoincore.org itself
          # being wrong: the sums come from the same host as the file. Doing
          # better means SHA256SUMS.asc and the builders' keys, which is real
          # key management for a throwaway regtest node in a disposable runner.
          if ! sha256sum --ignore-missing --check SHA256SUMS; then
            echo "::error::${TARBALL} does not match the published SHA256SUMS"
            exit 1
          fi

          tar -xzf "${TARBALL}" --strip-components=2 \
            "bitcoin-${CORE_VERSION}/bin/bitcoind" "bitcoin-${CORE_VERSION}/bin/bitcoin-cli"
          rm -f "${TARBALL}" SHA256SUMS

      - name: Run the integration test
        run: |
          export PATH="$HOME/bitcoin-core:$PATH"
          bitcoind -version | head -1
          node test/integration/regtest.js

  # The dev stack's node, with exactly the options docker-compose.dev.yml
  # gives it. Nobody starts that stack often, so an image bump to a Core that
  # dropped one of those options would otherwise sit unnoticed until somebody
  # did. Only bitcoind: the app services build the image, and the test job
  # already covers the code.
  dev-node:
    runs-on: ubuntu-latest
    name: Dev compose node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start bitcoind
        run: docker compose -f docker-compose.dev.yml up -d bitcoind
      - name: Same Core as CI, and it mines
        run: |
          set -euo pipefail
          BCLI="docker compose -f docker-compose.dev.yml exec -T bitcoind bitcoin-cli -regtest -rpcuser=bitcoinlab -rpcpassword=bitcoinlab"
          for i in $(seq 30); do $BCLI getnetworkinfo >/dev/null 2>&1 && break; sleep 2; done
          if ! $BCLI getnetworkinfo >/dev/null 2>&1; then
            docker compose -f docker-compose.dev.yml logs bitcoind
            echo "::error::The dev node did not answer RPC within a minute"
            exit 1
          fi
          WANT=$(sed -n "s/^ *CORE_VERSION: '\(.*\)'/\1/p" .github/workflows/ci.yml)
          GOT=$($BCLI getnetworkinfo | sed -n 's|.*"subversion": "/Satoshi:\([0-9.]*\)/".*|\1|p')
          echo "dev node runs Core ${GOT}, CI tests against ${WANT}"
          case "${GOT}" in
            "${WANT}"|"${WANT}".0) ;;
            *) echo "::error::docker-compose.dev.yml runs Core ${GOT}, CORE_VERSION is ${WANT}"; exit 1 ;;
          esac
          bash test/regtest-generate.sh
      - if: always()
        run: docker compose -f docker-compose.dev.yml down

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Reported, not enforced, and in its own job: an advisory in a transitive
      # dependency should show as its own mark rather than hide a real test
      # failure, and a project with two dependencies should look at one and
      # decide - not have every build blocked by something it cannot act on.
      - run: npm audit --audit-level=moderate || true
