name: Build and publish multi-arch image

# Triggers on every version tag (v1.0.0, v1.0.1, ...). The final step prints
# the exact `ghcr.io/<owner>/bitcoin-lab:<tag>@sha256:<digest>` reference to
# pin in the community app store - see RELEASING.md there. The pin needs both
# tag and digest: a moving tag would let two nodes install "the same version"
# and get different code. The digest can also be read from the GitHub Packages
# API, which is handy when the workflow logs are not reachable.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

# Least privilege, and `packages: write` is deliberately NOT here. At the
# workflow level it hands a GHCR-write token to every job in the file,
# including ones whose whole content is `npm ci` running third-party install
# scripts. It is granted below, on the single job that pushes.
permissions:
  contents: read

# A release never runs twice at once, and is never cancelled. cancel-in-progress
# is false on purpose: the dangerous moment is between "the multi-arch image is
# pushed" and "the smoke test says the arm64 half actually runs", and a run
# cancelled there leaves a published image that nothing has checked. Re-pushing
# a tag queues behind the run in flight instead of racing it to the registry.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Every `uses:` below is pinned to a full commit SHA with the released version
# in the comment beside it. This is the file where it matters most: this job
# holds `packages: write` and the GHCR token, and `@v3` is a promise by
# somebody else's account that the code behind that tag will not change. A SHA
# is the code. Upgrading is a deliberate edit: read the notes, change the SHA,
# change the comment.

jobs:
  # The whole of Tests, run here as this release's gate rather than as a second
  # workflow racing it. ci.yml and release.yml both used to start on a tag push
  # with no edge between them, so "the tests failed" and "the image was pushed"
  # were two independent answers - which is how peer-map v0.8.0 published while
  # its own image-build job was red.
  #
  # `needs: ci` on the publish job below is that edge. It covers the unit tests
  # on both Node versions and the regtest integration test: ci.yml gates that
  # one on a tag ref, and a called workflow sees the caller's ref, which is the
  # tag. Before v1.12.0 a tag went straight to build-and-push with no test run
  # at all; this is the same fix carried the rest of the way.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    # The only job in either workflow that may write a package - and the only
    # one that needs to.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: vars
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # `latest` moves only for a real release. A manual workflow_dispatch
          # from a branch used to push :main AND overwrite :latest with an
          # untagged build - which is exactly the "a moving tag means two nodes
          # installing the same version get different code" problem this
          # repository pins digests to avoid, reintroduced from the other end.
          tags: |
            ghcr.io/${{ github.repository_owner }}/bitcoin-lab:${{ steps.vars.outputs.tag }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/{0}/bitcoin-lab:latest', github.repository_owner) || '' }}
          # Layer cache, and why it is a registry cache rather than type=gha.
          #
          # What this build spends its time on is the builder stage: the
          # Dockerfile installs python3, make and g++ there because the two
          # runtime dependencies are native modules. better-sqlite3 and zeromq
          # normally install a prebuilt binary, but when none matches the
          # target - which is exactly the arm64 leg, running under QEMU - npm
          # falls back to compiling from source, and without a toolchain in the
          # image that fallback fails instead of being slow. So the toolchain is
          # not optional: it is the thing that makes the arm64 half buildable at
          # all. It is also installed on every release, emulated, from Debian's
          # mirrors, and none of that changes between v1.23.0 and v1.23.1.
          #
          # GitHub's Actions cache (type=gha, which peer-map's CI uses) would
          # not help here: it is scoped per ref, so a run on refs/tags/v1.23.1
          # cannot read what a run on refs/tags/v1.23.0 wrote, and this workflow
          # only ever runs on tags. Every release would write a cache no release
          # ever reads. A registry cache is one more tag in the same package, so
          # consecutive releases genuinely share it.
          #
          # ignore-error=true: the cache is an optimisation and must never be
          # able to fail a publish. image-manifest/oci-mediatypes are what GHCR
          # needs to store a cache manifest at all.
          #
          # The cost of this, stated plainly: an apt layer stays cached until
          # its cache key changes, so Debian security updates reach the image
          # when the Dockerfile or the lockfile changes, not when Debian ships
          # them. Deleting the `:buildcache` tag in the package forces a cold
          # rebuild whenever that matters.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/bitcoin-lab:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/bitcoin-lab:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

      # "The image built" is not the same statement as "the image runs". Both
      # runtime dependencies are native: better-sqlite3 and zeromq ship
      # compiled binaries per platform, and the Dockerfile prunes the ones a
      # Debian container cannot use - a per-platform delete, which is exactly
      # the kind of step that can take an architecture out without anyone
      # noticing. The test job above runs on ubuntu-latest, which is x86, and
      # the machine this app was developed on is x86 too. Nothing anywhere
      # actually executed the arm64 half before a user did.
      #
      # So: start the arm64 image under QEMU and make it load both modules and
      # open a database. Seconds, and it fails the release rather than the
      # install on somebody's Raspberry Pi.
      #
      # It runs after the push rather than before, because a multi-arch build
      # cannot be loaded into the local daemon to be tested first. That is
      # deliberate and safe here: nothing installs an image on its own. The
      # store package pins a digest that is copied out of this workflow by
      # hand, and a red workflow is one nobody copies a digest from.
      - name: Smoke-test the arm64 image
        run: |
          docker run --rm --platform linux/arm64 \
            ghcr.io/${{ github.repository_owner }}/bitcoin-lab:${{ steps.vars.outputs.tag }} \
            node -e "
              const Database = require('better-sqlite3');
              const zmq = require('zeromq');
              const db = new Database(':memory:');
              db.exec('CREATE TABLE t (a)');
              db.prepare('INSERT INTO t VALUES (1)').run();
              if (db.prepare('SELECT COUNT(*) AS n FROM t').get().n !== 1) throw new Error('sqlite did not round-trip');
              const sub = new zmq.Subscriber();
              sub.close();
              console.log('arm64: better-sqlite3 and zeromq both load and work');
            "

      - name: Print pinned reference for the app package
        run: |
          echo "Paste this into all four image: lines in bitcoin-lab-community-store/bitcoinlab-node/docker-compose.yml:"
          echo "ghcr.io/${{ github.repository_owner }}/bitcoin-lab:${{ steps.vars.outputs.tag }}@${{ steps.push.outputs.digest }}"
